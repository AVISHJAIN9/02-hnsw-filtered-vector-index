[package]
name = "hnsw-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Search HTTP API ingress and endpoints."

[dependencies]
hnsw-service = { path = "../service" }
hnsw-common = { path = "../common" }
hnsw-filter = { path = "../filter" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
