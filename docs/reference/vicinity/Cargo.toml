[dependencies.numpy]
version = "0.27.0"
optional = true

[dependencies.postcard]
version = "1.0"
features = [
    "use-crc",
    "alloc",
    "use-std",
]
optional = true

[dependencies.pyo3]
version = "0.27.2"
features = ["abi3-py39"]
optional = true

[dependencies.qntz]
version = "0.1.8"
features = ["simd"]
optional = true
package = "qntz"

[dependencies.rand]
version = "0.9"

[dependencies.rayon]
version = "1.10"
optional = true

[dependencies.rmt]
version = "0.1.2"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.sketchir]
version = "0.3.1"
optional = true

[dependencies.smallvec]
version = "1.11"

[dependencies.thiserror]
version = "2.0"

[dev-dependencies.anyhow]
version = "1.0"

[dev-dependencies.criterion]
